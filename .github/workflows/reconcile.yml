# Confirm payments the customer's browser never reported.
#
# Delivery normally happens the moment Razorpay's checkout reports success. On a
# phone that report is not guaranteed to arrive: paying by UPI sends the browser
# to another app, and an in-app webview — Instagram's above all, which is where
# most of this traffic comes from — is often killed while it waits there. The
# money is taken and nothing gets back to us to say so.
#
# Razorpay webhooks would close that gap and are not available on this account.
# Vercel cron would too, and the Hobby plan allows exactly one run a day. So the
# heartbeat lives here, where a public repository gets unlimited free minutes.
#
# WHAT THIS IS AND IS NOT
#
# It is the backstop for the customer who pays and never comes back to the site.
# It is not the fast path, and it does not need to be: the pay page asks the
# gateway before it renders, and the checkout polls while the customer is away,
# so anyone who returns is confirmed in seconds without this job running at all.
#
# ON TIMING. GitHub's floor is one run per five minutes, and scheduled runs are
# best-effort — GitHub staff acknowledged in June 2026 that drift had grown past
# 30%, with runs starting well late. Two things make that survivable here.
# First, each run sweeps twice, so a single cold start or network blip does not
# cost the whole slot. Second, and far more important, the sweep looks back a
# full 24 hours: a late run recovers exactly the customers a punctual one would
# have. Drift costs somebody waiting time. It cannot cost them a ticket.
#
# ON COST. Minutes are free and unlimited on a public repository, but they are
# not free to GitHub, and running a job continuously is not what Actions is for.
# Two sweeps keeps each run near two minutes. Raising the loop count tightens
# coverage and multiplies that; dropping it to one makes each run a few seconds.
# The gain from going denser is small, because anyone who returns to the site is
# already confirmed in seconds by the two paths above.
#
# The daily Vercel cron still runs the wide 30-day pass underneath this.
#
# ONE-TIME SETUP: add CRON_SECRET under
#   Settings -> Secrets and variables -> Actions -> New repository secret
# with the SAME value set in Vercel's environment variables. Without it every
# run fails loudly, which is the intended behaviour — a heartbeat that silently
# does nothing is worse than no heartbeat.
#
# NOTE: GitHub disables scheduled workflows on a public repository after 60 days
# with no commits. Any push resets that clock.

name: Reconcile payments

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # run it by hand from the Actions tab

# If a run is still going when the next is due, the newer one wins. The sweep is
# idempotent, so abandoning a run midway is safe, and this stops delayed runs
# queueing into a backlog.
concurrency:
  group: reconcile
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sweep for payments that were never confirmed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions, matching the value in Vercel."
            exit 1
          fi

          # A short window on purpose: each booking in it costs one live Razorpay
          # lookup, and a booking abandoned days ago is never going to become a
          # payment. The daily Vercel cron sweeps wider.
          URL="https://www.houzofvybe.com/api/cron/reconcile?hours=24"

          sweep() {
            BODY=$(curl -sS --max-time 90 --retry 2 --retry-delay 5 \
              -w '\n%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$URL")

            CODE=$(printf '%s' "$BODY" | tail -n1)
            JSON=$(printf '%s' "$BODY" | sed '$d')

            # NEVER print the response body. Action logs on a public repository
            # are world-readable, and a booking reference is a bearer credential:
            # /booking/<reference> needs no login and renders the customer's name
            # and their QR passes. Only the status and counts leave this job.
            if [ "$CODE" != "200" ]; then
              echo "  HTTP $CODE"
              return 1
            fi

            RECOVERED=$(printf '%s' "$JSON" | sed -n 's/.*"recovered":\([0-9]*\).*/\1/p')
            MAILED=$(printf '%s' "$JSON" | sed -n 's/.*"emailsSent":\([0-9]*\).*/\1/p')
            echo "  HTTP 200  recovered=${RECOVERED:-0}  emails_resent=${MAILED:-0}"

            if [ -n "${RECOVERED:-}" ] && [ "$RECOVERED" != "0" ]; then
              echo "::warning::Recovered $RECOVERED paid booking(s) whose browser never confirmed"
            fi
            if [ -n "${MAILED:-}" ] && [ "$MAILED" != "0" ]; then
              echo "::warning::Re-sent $MAILED ticket email(s) that had previously failed"
            fi
            return 0
          }

          # Two passes per run. GitHub will not schedule us more often than every
          # five minutes, so a second pass halves the worst case inside a slot
          # and means one cold start does not waste it.
          PASSES=2
          FAILURES=0
          for ATTEMPT in $(seq 1 $PASSES); do
            echo "sweep $ATTEMPT/$PASSES"
            sweep || FAILURES=$((FAILURES + 1))
            if [ "$ATTEMPT" != "$PASSES" ]; then sleep 120; fi
          done

          # One transient blip is not worth a red run; losing every sweep means
          # the heartbeat is genuinely down and somebody should know.
          if [ "$FAILURES" = "$PASSES" ]; then
            echo "::error::Every sweep failed - payment confirmation is not running"
            exit 1
          fi
